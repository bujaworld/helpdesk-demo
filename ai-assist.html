<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Assist</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial, sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#0b3d91,#1f5bd8);
display:flex;
flex-direction:column;
color:white;
}

.ai-header{
height:80px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.ai-title{
font-size:28px;
font-weight:600;
letter-spacing:1px;
}

.ai-close{
font-size:15px;
cursor:pointer;
opacity:.8;
}

.ai-close:hover{
opacity:1;
}

.ai-main{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
}

.ai-desc{
max-width:700px;
line-height:1.6;
opacity:.9;
margin-bottom:40px;
}

.ai-suggestions{
display:flex;
gap:20px;
margin-bottom:40px;
flex-wrap:wrap;
justify-content:center;
}

.ai-suggest{
background:white;
color:#1f5bd8;
padding:14px 22px;
border-radius:28px;
font-size:14px;
cursor:pointer;
transition:.2s;
}

.ai-suggest:hover{
background:#e8f0ff;
}

.ai-input-area{
width:100%;
max-width:820px;
display:flex;
align-items:center;
background:white;
border-radius:10px;
padding:12px 16px;
}

.ai-input{
flex:1;
border:none;
outline:none;
font-size:15px;
color:#333;
}

.ai-send{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
color:#1f5bd8;
font-size:18px;
}

.ai-send:hover{
opacity:.7;
}

</style>
</head>

<body>

<div class="ai-header">
<div class="ai-title">AI ASSIST</div>
<div class="ai-close" onclick="window.close()">close ✕</div>
</div>

<div class="ai-main">

<div class="ai-desc">
Ask the AI assistant about Horizon Europe programmes, funding rules, proposal preparation, or project participation in Europe.
</div>

<div class="ai-suggestions">

<div class="ai-suggest">Funding opportunities?</div>
<div class="ai-suggest">Proposal preparation tips</div>
<div class="ai-suggest">Eligibility rules</div>

</div>

<div class="ai-input-area">

<input class="ai-input" placeholder="Type your question here...">

<div class="ai-send">➤</div>

</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Europe 헬프데스크 관리자 로그인</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#1e3a8a,#0f172a);
}

.login-box{
  width:420px;
  background:#ffffff;
  padding:40px;
  border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
  text-align:center;
}

.logo{
  width:240px;
  margin-bottom:20px;
}

.title{
  font-size:18px;
  font-weight:600;
  margin-bottom:30px;
}

.form-group{
  margin-bottom:15px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:6px;
  font-size:14px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  background:#1e293b;
  color:#fff;
  font-size:14px;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#334155;
}

.footer{
  margin-top:20px;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<div class="login-box">

<img src="images/brand-logo.svg" class="logo">

<div class="title">
Horizon Europe 헬프데스크 관리자
</div>

<form id="adminLoginForm">

<div class="form-group">
<input type="text" id="adminId" placeholder="관리자 ID">
</div>

<div class="form-group">
<input type="password" id="adminPassword" placeholder="비밀번호">
</div>

<button type="submit">로그인</button>

</form>

<div class="footer">
Admin System
</div>

</div>

</body>
</html>
